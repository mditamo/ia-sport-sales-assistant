apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-sport-sales-ingress
  namespace: ai-sport-sales
spec:
  rules:
    - host: ai-sport-sales.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-sport-sales-service
                port:
                  number: 80
